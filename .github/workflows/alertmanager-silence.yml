on:
  workflow_call:
    inputs:
      do_silence:
        description: 'True to create silences covering namespaces with hibernated datastores. False to expire the silences created by this run.'
        required: true
        type: boolean
      run_tag:
        description: 'Unique tag stamped into each silence comment so the expire leg can find them.'
        required: true
        type: string

env:
  CLIENT_CERT_DATA: ${{ secrets.KUBE_CLIENT_CERT_DATA }}
  CLIENT_KEY_DATA: ${{ secrets.KUBE_CLIENT_KEY_DATA }}
  CLUSTER_CA_CERT_DATA: ${{ secrets.KUBE_CLUSTER_CA_CERT_DATA }}
  SERVER_IP_ADDRESS: ${{ secrets.K3S_IP_ADDRESS }}
  SERVER_KUBE_PORT: ${{ vars.SERVER_KUBE_PORT }}

jobs:
  manage-silence:
    runs-on: self-hosted

    # Bounds the expire leg, which polls (up to 25m internally) until backup-induced
    # alerts clear before re-arming.
    timeout-minutes: 30

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'

      - name: "Create silence"
        if: ${{ inputs.do_silence }}
        env:
          ALERTMANAGER_POD: alertmanager-kube-prometheus-stack-alertmanager-0
          RUN_TAG: ${{ inputs.run_tag }}
        run: |
          set -euo pipefail

          # Discover every namespace that contains a hibernated stateful resource,
          # using the same CRDs the databases-hibernate workflow targets. In this
          # cluster the dependent app workloads co-locate with their datastores, so
          # the datastore namespace is also where the crash-loop alerts will fire.
          NAMESPACES="$(
            for crd in \
                clusters.postgresql.cnpg.io \
                clickhouseinstallations \
                clickhousekeeperinstallations \
                mariadbs.k8s.mariadb.com \
                kafkas.kafka.strimzi.io \
                opensearchclusters.opensearch.org; do
              kubectl get "$crd" -A -o jsonpath='{.items[*].metadata.namespace}' 2>/dev/null || true
              printf ' '
            done | tr ' ' '\n' | sed '/^$/d' | sort -u
          )"

          if [ -z "$NAMESPACES" ]; then
            echo "No hibernated resources found; nothing to silence."
            exit 0
          fi

          NS_REGEX="$(printf '%s' "$NAMESPACES" | paste -sd '|' -)"
          echo "Silencing alerts for namespaces matching: $NS_REGEX"

          # Snapshot the alerts already firing in the affected namespaces *before*
          # hibernation starts. This is the pre-existing baseline: anything in it is,
          # by definition, not caused by this backup. The expire leg waits until the
          # live set is a subset of this baseline before re-arming, so pre-existing
          # alerts never delay unsilencing and no alertname allowlist is needed.
          # Fingerprints are stable per label-set.
          export NS_PATTERN="^(${NS_REGEX})$"
          BASELINE=""
          ALERTS_JSON="$(kubectl -n prometheus exec "$ALERTMANAGER_POD" -c alertmanager -- \
            wget -qO- 'http://localhost:9093/api/v2/alerts?active=true&silenced=true&unprocessed=true' 2>/dev/null || true)"
          case "$ALERTS_JSON" in
            \[*)
              BASELINE="$(printf '%s' "$ALERTS_JSON" | yq -r \
                '[.[] | select(.labels.namespace // "" | test(strenv(NS_PATTERN))) | .fingerprint] | unique | join(",")')"
              ;;
            *)
              echo "WARN: could not reach Alertmanager to capture baseline; assuming empty baseline."
              ;;
          esac
          echo "Pre-existing baseline fingerprints: ${BASELINE:-<none>}"

          # amtool is shipped inside the alertmanager image; run it via kubectl exec
          # so no CLI install or port-forward is needed on the runner. The 6h duration
          # is only a safety net; the expire step is what ends it. The comment carries
          # the run_tag (for lookup) and the baseline fingerprints (for the recovery
          # wait in the expire leg).
          COMMENT="${RUN_TAG}|baseline=${BASELINE}"
          kubectl -n prometheus exec "$ALERTMANAGER_POD" -c alertmanager -- \
            amtool --alertmanager.url=http://localhost:9093 silence add \
            "namespace=~${NS_REGEX}" -a nightly-backup -d 6h -c "$COMMENT"

      - name: "Expire silence"
        if: ${{ !inputs.do_silence }}
        env:
          ALERTMANAGER_POD: alertmanager-kube-prometheus-stack-alertmanager-0
          RUN_TAG: ${{ inputs.run_tag }}
        run: |
          set -euo pipefail

          export RUN_TAG

          SILENCES_JSON="$(kubectl -n prometheus exec "$ALERTMANAGER_POD" -c alertmanager -- \
            amtool -o json --alertmanager.url=http://localhost:9093 silence query)"

          # Find our silence(s) by run_tag prefix and pull the baseline out of the comment.
          BASELINE_COMMENT="$(printf '%s' "$SILENCES_JSON" | yq -r \
            '[.[] | select((.comment | split("|")[0]) == strenv(RUN_TAG)) | .comment] | .[0] // ""')"
          if [ -z "$BASELINE_COMMENT" ]; then
            echo "No silences tagged \"${RUN_TAG}|*\" found; nothing to expire."
            exit 0
          fi
          case "$BASELINE_COMMENT" in
            *"|baseline="*) BASELINE="${BASELINE_COMMENT##*|baseline=}" ;;
            *) BASELINE="" ;;
          esac
          printf '%s' "$BASELINE" | tr ',' '\n' | sed '/^$/d' | sort -u > /tmp/baseline.txt
          echo "Baseline fingerprints ($(wc -l < /tmp/baseline.txt | tr -d ' ')): $(paste -sd, /tmp/baseline.txt 2>/dev/null || true)"

          # Re-discover the affected namespaces so the live query matches the silence scope.
          NAMESPACES="$(
            for crd in \
                clusters.postgresql.cnpg.io \
                clickhouseinstallations \
                clickhousekeeperinstallations \
                mariadbs.k8s.mariadb.com \
                kafkas.kafka.strimzi.io \
                opensearchclusters.opensearch.org; do
              kubectl get "$crd" -A -o jsonpath='{.items[*].metadata.namespace}' 2>/dev/null || true
              printf ' '
            done | tr ' ' '\n' | sed '/^$/d' | sort -u
          )"
          NS_REGEX="$(printf '%s' "$NAMESPACES" | paste -sd '|' -)"
          export NS_PATTERN="^(${NS_REGEX})$"

          # Bounded poll: wait until every live alert in the affected namespaces was
          # already firing before the backup (current ⊆ baseline). The backup-induced
          # alerts (fingerprints not in baseline) clear once pods recover. A timeout
          # ensures a genuinely new issue re-arms instead of hanging forever.
          POLL_INTERVAL=30
          TIMEOUT=1500   # 25 min; observed recovery ~14 min
          DEADLINE=$(( $(date +%s) + TIMEOUT ))
          echo "Waiting up to $((TIMEOUT/60))m for backup-induced alerts to clear..."
          ITER=0
          while :; do
            ITER=$((ITER + 1))
            ALERTS_JSON="$(kubectl -n prometheus exec "$ALERTMANAGER_POD" -c alertmanager -- \
              wget -qO- 'http://localhost:9093/api/v2/alerts?active=true&silenced=true&unprocessed=true' 2>/dev/null || true)"
            case "$ALERTS_JSON" in
              \[*) ;;
              *)
                echo "[$ITER] Alertmanager query failed; retrying in ${POLL_INTERVAL}s..."
                sleep "$POLL_INTERVAL"
                continue
                ;;
            esac
            CURRENT="$(printf '%s' "$ALERTS_JSON" | yq -r \
              '[.[] | select(.labels.namespace // "" | test(strenv(NS_PATTERN))) | .fingerprint] | unique | join(",")')"
            printf '%s' "$CURRENT" | tr ',' '\n' | sed '/^$/d' | sort -u > /tmp/current.txt
            NEW="$(comm -13 /tmp/baseline.txt /tmp/current.txt)"

            if [ -z "$NEW" ]; then
              echo "[$ITER] All backup-induced alerts cleared. Safe to unsilence."
              break
            fi
            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "[timeout] $(wc -l < /tmp/current.txt | tr -d ' ') non-baseline alert(s) still live after $((TIMEOUT/60))m; unsilencing anyway."
              break
            fi
            echo "[$ITER] $(printf '%s\n' "$NEW" | grep -c . || true) non-baseline alert(s) still live; ~$(( (DEADLINE - NOW) / 60 ))m left."
            sleep "$POLL_INTERVAL"
          done

          # Expire the silence(s) for this run. Idempotent.
          IDS="$(printf '%s' "$SILENCES_JSON" | yq -r \
            '.[] | select((.comment | split("|")[0]) == strenv(RUN_TAG)) | .id')"
          for id in $IDS; do
            echo "Expiring silence $id"
            kubectl -n prometheus exec "$ALERTMANAGER_POD" -c alertmanager -- \
              amtool --alertmanager.url=http://localhost:9093 silence expire "$id"
          done
