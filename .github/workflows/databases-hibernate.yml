on:
  workflow_dispatch:
    inputs:
      do-hibernate:
        description: 'True to hibernate databases. False to restart.'
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      do-hibernate:
        required: true
        type: boolean
    outputs:
      attempted:
        description: "True if at least one hibernate/restart matrix leg actually executed"
        value: ${{ jobs.report-hibernation-status.outputs.attempted }}

env:
  CLIENT_CERT_DATA: ${{ secrets.KUBE_CLIENT_CERT_DATA }}
  CLIENT_KEY_DATA: ${{ secrets.KUBE_CLIENT_KEY_DATA }}
  CLUSTER_CA_CERT_DATA: ${{ secrets.KUBE_CLUSTER_CA_CERT_DATA }}
  SERVER_IP_ADDRESS: ${{ secrets.K3S_IP_ADDRESS }}
  SERVER_KUBE_PORT: ${{ vars.SERVER_KUBE_PORT }}

jobs:
  get-postgres-databases:
    runs-on: self-hosted

    outputs:
      databases: ${{ steps.get-databases.outputs.databases}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get Databases"
        id: "get-databases"
        run: |
          kubectl get clusters.postgresql.cnpg.io -A -o yaml > clusters.yml
          yq '.items[].metadata | pick(["name", "namespace"])' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "databases=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  get-clickhouse-databases:
    runs-on: self-hosted

    outputs:
      databases: ${{ steps.get-databases.outputs.databases}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get Databases"
        id: "get-databases"
        run: |
          kubectl get clickhouseinstallations -A -o yaml > clusters.yml
          yq '.items[] | {"name": .metadata.name, "namespace": .metadata.namespace, "replicas": (.spec.configuration.clusters[0].layout.replicasCount // 1)}' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "databases=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  get-clickhouse-keeper-databases:
    runs-on: self-hosted

    outputs:
      databases: ${{ steps.get-databases.outputs.databases}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get Databases"
        id: "get-databases"
        run: |
          kubectl get clickhousekeeperinstallations -A -o yaml > clusters.yml
          yq '.items[] | {"name": .metadata.name, "namespace": .metadata.namespace}' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "databases=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  get-mariadb-databases:
    runs-on: self-hosted

    outputs:
      databases: ${{ steps.get-databases.outputs.databases}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get Databases"
        id: "get-databases"
        run: |
          kubectl get mariadbs.k8s.mariadb.com -A -o yaml > clusters.yml
          yq '.items[].metadata | pick(["name", "namespace"])' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "databases=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  hibernate-postgres-databases:
    needs: [
      get-postgres-databases,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-postgres-databases.outputs.databases != '' }}

    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJson(needs.get-postgres-databases.outputs.databases) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Hibernate / restart DB"
        env:
          HIBERNATE_CHOICE: ${{ inputs.do-hibernate && 'on' || 'off' }}
        run: "kubectl -n ${{ matrix.database.namespace }} annotate clusters.postgresql.cnpg.io ${{ matrix.database.name }} --overwrite cnpg.io/hibernation=${{ env.HIBERNATE_CHOICE }}"
      - name: "Wait for hibernate"
        if: ${{ inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} wait clusters.postgresql.cnpg.io ${{ matrix.database.name }} --timeout 30m --for "jsonpath={.status.conditions[?(.type==\"cnpg.io/hibernation\")].status}=True"
      - name: "Wait for restart"
        if: ${{ !inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} wait clusters.postgresql.cnpg.io ${{ matrix.database.name }} --timeout 30m --for "jsonpath={.status.readyInstances}=$(kubectl -n ${{ matrix.database.namespace }} get clusters.postgresql.cnpg.io ${{ matrix.database.name }} -o "jsonpath={.status.instances}")"

  hibernate-clickhouse-databases:
    needs: [
      get-clickhouse-databases,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-clickhouse-databases.outputs.databases != '' }}

    strategy:
      fail-fast: false
      matrix:
        clickhouse: ${{ fromJson(needs.get-clickhouse-databases.outputs.databases) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Hibernate / restart ClickHouse"
        env:
          STOP_VALUE: ${{ inputs.do-hibernate && '1' || '0' }}
        run: kubectl -n ${{ matrix.clickhouse.namespace }} patch clickhouseinstallation ${{ matrix.clickhouse.name }} --type=merge -p '{"spec":{"stop":"${{ env.STOP_VALUE }}"}}'
      - name: "Wait for scale down"
        if: ${{ inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.clickhouse.namespace }} wait clickhouseinstallation ${{ matrix.clickhouse.name }} --timeout 30m --for "jsonpath={.status.status}=Completed"
      - name: "Wait for scale up"
        if: ${{ !inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.clickhouse.namespace }} wait clickhouseinstallation ${{ matrix.clickhouse.name }} --timeout 30m --for "jsonpath={.status.status}=Completed"

  hibernate-clickhouse-keeper-databases:
    needs: [
      get-clickhouse-keeper-databases,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-clickhouse-keeper-databases.outputs.databases != '' }}

    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJson(needs.get-clickhouse-keeper-databases.outputs.databases) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Hibernate / restart Keeper"
        env:
          STOP_VALUE: ${{ inputs.do-hibernate && '1' || '0' }}
        run: kubectl -n ${{ matrix.database.namespace }} patch clickhousekeeperinstallation ${{ matrix.database.name }} --type=merge -p '{"spec":{"stop":"${{ env.STOP_VALUE }}"}}'
      - name: "Wait for hibernate"
        if: ${{ inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} wait clickhousekeeperinstallation ${{ matrix.database.name }} --timeout 30m --for "jsonpath={.status.status}=Completed"
      - name: "Wait for restart"
        if: ${{ !inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} wait clickhousekeeperinstallation ${{ matrix.database.name }} --timeout 30m --for "jsonpath={.status.status}=Completed"

  hibernate-mariadb-databases:
    needs: [
      get-mariadb-databases,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-mariadb-databases.outputs.databases != '' }}

    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJson(needs.get-mariadb-databases.outputs.databases) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Hibernate DB"
        if: ${{ inputs.do-hibernate }}
        run: |
          kubectl -n ${{ matrix.database.namespace }} patch mariadbs.k8s.mariadb.com ${{ matrix.database.name }} --type=merge -p '{"spec":{"suspend":true}}'
          kubectl -n ${{ matrix.database.namespace }} scale statefulset ${{ matrix.database.name }} --replicas=0
      - name: "Wait for hibernate"
        if: ${{ inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} wait statefulset ${{ matrix.database.name }} --timeout 30m --for "jsonpath={.status.replicas}=0"
      - name: "Restart DB"
        if: ${{ !inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} patch mariadbs.k8s.mariadb.com ${{ matrix.database.name }} --type=merge -p '{"spec":{"suspend":false}}'
      - name: "Wait for restart"
        if: ${{ !inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.database.namespace }} wait mariadbs.k8s.mariadb.com ${{ matrix.database.name }} --timeout 30m --for "jsonpath={.status.conditions[?(.type==\"Ready\")].status}=True"

  # ***** other stateful apps hibernate

  get-kafka-clusters:
    runs-on: self-hosted

    outputs:
      clusters: ${{ steps.get-clusters.outputs.clusters}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get Kafka clusters"
        id: "get-clusters"
        run: |
          kubectl get kafkas.kafka.strimzi.io -A -o yaml > clusters.yml
          yq '.items[].metadata | pick(["name", "namespace"])' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "clusters=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  hibernate-kafka-operator:
    runs-on: self-hosted

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Stop Kafka operator"
        if: ${{ inputs.do-hibernate }}
        run: |
          kubectl -n kafka-operator scale deploy strimzi-cluster-operator --replicas=0
          kubectl -n kafka-operator wait pod -l strimzi.io/kind=cluster-operator --for=delete --timeout=5m
      - name: "Start Kafka operator"
        if: ${{ !inputs.do-hibernate }}
        run: |
          kubectl -n kafka-operator scale deploy strimzi-cluster-operator --replicas=1
          kubectl -n kafka-operator wait deploy strimzi-cluster-operator --for=jsonpath='{.status.readyReplicas}=1' --timeout=5m

  hibernate-kafka-clusters:
    needs: [
      get-kafka-clusters,
      hibernate-kafka-operator,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-kafka-clusters.outputs.clusters != '' }}

    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJson(needs.get-kafka-clusters.outputs.clusters) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Delete Kafka pods"
        if: ${{ inputs.do-hibernate }}
        run: kubectl delete pods -n ${{ matrix.cluster.namespace }} -l strimzi.io/cluster=${{ matrix.cluster.name }} --timeout=10m
      - name: "Wait for Kafka Ready"
        if: ${{ !inputs.do-hibernate }}
        run: kubectl -n ${{ matrix.cluster.namespace }} wait kafka ${{ matrix.cluster.name }} --timeout 30m --for "jsonpath={.status.conditions[?(@.type==\"Ready\")].status}=True"

  get-opensearch-clusters:
    runs-on: self-hosted

    outputs:
      clusters: ${{ steps.get-clusters.outputs.clusters}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get OpenSearch clusters"
        id: "get-clusters"
        run: |
          kubectl get opensearchclusters.opensearch.org -A -o yaml > clusters.yml
          yq '.items[].metadata | pick(["name", "namespace"])' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "clusters=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  hibernate-opensearch-operator:
    runs-on: self-hosted

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Stop OpenSearch operator"
        if: ${{ inputs.do-hibernate }}
        run: |
          kubectl -n opensearch-operator scale deploy opensearch-operator --replicas=0
          kubectl -n opensearch-operator wait pod -l app.kubernetes.io/name=opensearch-operator --for=delete --timeout=5m
      - name: "Start OpenSearch operator"
        if: ${{ !inputs.do-hibernate }}
        run: |
          kubectl -n opensearch-operator scale deploy opensearch-operator --replicas=1
          kubectl -n opensearch-operator wait deploy opensearch-operator --for=jsonpath='{.status.readyReplicas}=1' --timeout=5m

  hibernate-opensearch-clusters:
    needs: [
      get-opensearch-clusters,
      hibernate-opensearch-operator,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-opensearch-clusters.outputs.clusters != '' }}

    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJson(needs.get-opensearch-clusters.outputs.clusters) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Scale OpenSearch StatefulSets to 0"
        if: ${{ inputs.do-hibernate }}
        run: |
          NS=${{ matrix.cluster.namespace }}
          CLUSTER=${{ matrix.cluster.name }}
          for sts in $(kubectl get sts -n "$NS" -l opensearch.org/opensearch-cluster="$CLUSTER" -o jsonpath='{.items[*].metadata.name}'); do
            kubectl -n "$NS" scale sts "$sts" --replicas=0
          done
          kubectl -n "$NS" wait pod -l opensearch.org/opensearch-cluster="$CLUSTER" --for=delete --timeout=5m
      - name: "Wait for OpenSearch Ready"
        if: ${{ !inputs.do-hibernate }}
        run: |
          NS=${{ matrix.cluster.namespace }}
          CLUSTER=${{ matrix.cluster.name }}
          for sts in $(kubectl get sts -n "$NS" -l opensearch.org/opensearch-cluster="$CLUSTER" -o jsonpath='{.items[*].metadata.name}'); do
            echo "Waiting for operator to restore replicas for $sts..."
            timeout 10m bash -c "while [ \$(kubectl get sts $sts -n $NS -o jsonpath='{.spec.replicas}') = '0' ]; do sleep 5; done"
          done
          echo "Waiting for pods to be created..."
          timeout 5m bash -c "while [ -z \$(kubectl get pods -n $NS -l opensearch.org/opensearch-cluster=$CLUSTER -o jsonpath='{.items[*].metadata.name}' 2>/dev/null) ]; do sleep 5; done"
          echo "Waiting for pods to be Ready..."
          kubectl -n "$NS" wait pod -l opensearch.org/opensearch-cluster="$CLUSTER" --for=condition=Ready --timeout=30m

  get-elasticsearch-clusters:
    runs-on: self-hosted

    outputs:
      clusters: ${{ steps.get-clusters.outputs.clusters}}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Get Elasticsearch clusters"
        id: "get-clusters"
        run: |
          kubectl get elasticsearches.elasticsearch.k8s.elastic.co -A -o yaml > clusters.yml
          yq '.items[].metadata | pick(["name", "namespace"])' clusters.yml -o json -I 0 > dbs.json
          sed -i '{:q;N;s/\n/, /g;t q}' dbs.json
          sed -i 's#^#[#' dbs.json
          sed -i 's#$#]#' dbs.json
          truncate -s -1 dbs.json
          echo "clusters=$(cat dbs.json)" >> "$GITHUB_OUTPUT"

  hibernate-elasticsearch-clusters:
    needs: [
      get-elasticsearch-clusters,
    ]
    runs-on: self-hosted
    if: ${{ needs.get-elasticsearch-clusters.outputs.clusters != '' }}

    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJson(needs.get-elasticsearch-clusters.outputs.clusters) }}

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Add cluster CA certificate"
        run: |
          echo "$CLUSTER_CA_CERT_DATA" > cluster.cert.pem
          sudo mkdir /usr/local/share/ca-certificates/extra
          sudo cp cluster.cert.pem /usr/local/share/ca-certificates/extra/cluster.cert.crt
          sudo update-ca-certificates
      - name: "Generate and install kubeconfig"
        working-directory: ./iac
        run: |
          ./cluster-config-write.sh
          mkdir ~/.kube
          cp cluster.yml ~/.kube/config
      - name: "Setup kubectl"
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.33.6'
      - name: "Pause ECK orchestration and scale StatefulSets to 0"
        if: ${{ inputs.do-hibernate }}
        run: |
          NS=${{ matrix.cluster.namespace }}
          CLUSTER=${{ matrix.cluster.name }}
          # Pause ECK orchestration for the whole window: the workflow owns the
          # sts replicas instead of the operator. ECK cannot re-upscale a
          # single-master ES 7.x cluster from 0 (its upscale path needs a
          # reachable ES API), so leaving it managing the sts wedges the CR in
          # "Upscaling from 0 to 1" forever. Certs/services/PDB/health keep
          # running while paused (ECK 3.5+).
          kubectl -n "$NS" annotate elasticsearch "$CLUSTER" eck.k8s.elastic.co/pause-orchestration=true --overwrite
          for sts in $(kubectl get sts -n "$NS" -l elasticsearch.k8s.elastic.co/cluster-name="$CLUSTER" -o jsonpath='{.items[*].metadata.name}'); do
            kubectl -n "$NS" scale sts "$sts" --replicas=0
          done
          kubectl -n "$NS" wait pod -l elasticsearch.k8s.elastic.co/cluster-name="$CLUSTER" --for=delete --timeout=5m
      - name: "Scale StatefulSets back up (orchestration still paused)"
        if: ${{ !inputs.do-hibernate }}
        run: |
          NS=${{ matrix.cluster.namespace }}
          CLUSTER=${{ matrix.cluster.name }}
          # Target replicas come from the CR: sts <cluster>-es-<nodeSet> maps to
          # spec.nodeSets[name=nodeSet].count. Scaling is safe while paused;
          # ECK never has to re-upscale from 0 itself (see hibernate leg).
          kubectl -n "$NS" get elasticsearch "$CLUSTER" -o yaml > es.yml
          for sts in $(kubectl get sts -n "$NS" -l elasticsearch.k8s.elastic.co/cluster-name="$CLUSTER" -o jsonpath='{.items[*].metadata.name}'); do
            NODESET=${sts#"$CLUSTER"-es-}
            REPLICAS=$(yq ".spec.nodeSets[] | select(.name == \"$NODESET\") | .count" es.yml)
            echo "Scaling $sts to $REPLICAS..."
            kubectl -n "$NS" scale sts "$sts" --replicas="$REPLICAS"
          done
      - name: "Wait for Elasticsearch Ready"
        if: ${{ !inputs.do-hibernate }}
        run: |
          NS=${{ matrix.cluster.namespace }}
          CLUSTER=${{ matrix.cluster.name }}
          echo "Waiting for pods to be Ready..."
          kubectl -n "$NS" wait pod -l elasticsearch.k8s.elastic.co/cluster-name="$CLUSTER" --for=condition=Ready --timeout=30m
          # Hand control back to ECK once ES is reachable, then require the CR
          # to settle. Removal is || true so a missing annotation (e.g. manual
          # intervention mid-window) doesn't fail the job.
          kubectl -n "$NS" annotate elasticsearch "$CLUSTER" eck.k8s.elastic.co/pause-orchestration- --overwrite || true
          kubectl -n "$NS" wait elasticsearch "$CLUSTER" --timeout=10m --for "jsonpath={.status.phase}=Ready"

  report-hibernation-status:
    needs: [
      hibernate-postgres-databases,
      hibernate-clickhouse-databases,
      hibernate-clickhouse-keeper-databases,
      hibernate-mariadb-databases,
      hibernate-kafka-clusters,
      hibernate-opensearch-clusters,
      hibernate-elasticsearch-clusters,
    ]
    if: always() && !cancelled() && inputs.do-hibernate
    runs-on: ubuntu-latest
    outputs:
      attempted: ${{ (needs.hibernate-postgres-databases.result != 'skipped') || (needs.hibernate-clickhouse-databases.result != 'skipped') || (needs.hibernate-clickhouse-keeper-databases.result != 'skipped') || (needs.hibernate-mariadb-databases.result != 'skipped') || (needs.hibernate-kafka-clusters.result != 'skipped') || (needs.hibernate-opensearch-clusters.result != 'skipped') || (needs.hibernate-elasticsearch-clusters.result != 'skipped') }}
    steps:
      - name: "Report status"
        run: echo "done"
