name: Deploy
on:
  workflow_dispatch:
    inputs:
      runner-type:
        description: 'Runners to use'
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
  workflow_call:
    inputs:
      runner-type:
        required: false
        default: self-hosted
        type: string

jobs:
  deploy-tf-state-namespace:
    uses: ./.github/workflows/kubernetes-manifest-deploy.yml
    secrets: inherit

    with:
      manifest-file: ./iac/tf-state-namespace.yml
      runner-type: ${{ inputs.runner-type }}

  deploy-github-org-runner:
    needs: [
      deploy-tf-state-namespace,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/github-org-runners
      runner-type: ${{ inputs.runner-type }}

  deploy-openebs:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/openebs

  deploy-grafana-operator:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/grafana-operator

  deploy-valkey-operator:
    needs: [
      deploy-grafana-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/valkey-operator

  deploy-prometheus-operator:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/prometheus-operator

  deploy-cert-manager:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/cert-manager

  deploy-kubevirt-operator:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/kubevirt-operator

  deploy-clickhouse-operator:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/clickhouse-operator
      needs-kubectl: true

  deploy-kafka-operator:
    needs: [
      deploy-github-org-runner,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/kafka-operator

  deploy-opensearch-operator:
    needs: [
      deploy-cert-manager,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/opensearch-operator

  deploy-traefik:
    needs: [
      deploy-openebs,
      deploy-cert-manager,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/traefik

  deploy-cloudnative-pg:
    needs: [
      deploy-openebs,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/cloudnative-pg

  deploy-mariadb-operator:
    needs: [
      deploy-openebs,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/mariadb-operator

  deploy-velero:
    needs: [
      deploy-openebs,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/velero

  deploy-kubevirt:
    needs: [
      deploy-openebs,
      deploy-kubevirt-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      needs-kubectl: true
      iac-dir: ./iac/kubevirt

  deploy-crowdsec:
    needs: [
      deploy-traefik,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/crowdsec

  deploy-traefik-config:
    needs: [
      deploy-traefik,
      deploy-crowdsec,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/traefik-config

  deploy-openldap:
    needs: [
      deploy-traefik-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/openldap

  deploy-keycloak:
    needs: [
      deploy-cloudnative-pg,
      deploy-openldap,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/keycloak

  deploy-keycloak-config:
    needs: [
      deploy-keycloak,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/keycloak-config

  deploy-vaultwarden:
    needs: [
      deploy-cloudnative-pg,
      deploy-openldap,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/vaultwarden

  deploy-ocis:
    needs: [
      deploy-keycloak-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/ocis
      resource-name: null_resource.ocis_helm_repo_clone
      force-apply-all: true

  deploy-prometheus:
    needs: [
      deploy-prometheus-operator,
      deploy-openebs,
      deploy-grafana,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/prometheus

  deploy-grafana:
    needs: [
      deploy-grafana-operator,
      deploy-keycloak-config,
      deploy-traefik,
      deploy-openebs,
      deploy-cloudnative-pg,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/grafana

  deploy-bulk:
    needs: [
      deploy-keycloak-config,
      deploy-mariadb-operator,
      deploy-grafana-operator,
      deploy-velero,
      deploy-kafka-operator,
      deploy-opensearch-operator,
      deploy-clickhouse-operator,
      deploy-cloudnative-pg,
      deploy-traefik-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    strategy:
      fail-fast: false
      matrix:
        application: [
          outline,
          services,
          13ft,
          n8n,
          erpnext,
          web-check,
          convertx,
          posthog,
          sentry,
        ]

    with:
      iac-dir: ./iac/${{ matrix.application }}

  # --- OpenTelemetry tracing platform ---
  # operator -> Tempo backend -> collector (collector exports into Tempo).
  deploy-otel-operator:
    needs: [
      deploy-cert-manager,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/otel-operator

  deploy-tempo:
    needs: [
      deploy-grafana,
      deploy-openebs,
      deploy-prometheus-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/tempo

  deploy-otel-collector:
    needs: [
      deploy-otel-operator,
      deploy-tempo,
      deploy-prometheus-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/otel-collector
