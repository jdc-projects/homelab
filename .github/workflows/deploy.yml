name: Deploy
on:
  workflow_dispatch:
    inputs:
      runner-type:
        description: 'Runners to use'
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
  workflow_call:
    inputs:
      runner-type:
        required: false
        default: self-hosted
        type: string

jobs:
  deploy-tf-state-namespace:
    uses: ./.github/workflows/kubernetes-manifest-deploy.yml
    secrets: inherit

    with:
      manifest-file: ./iac/tf-state-namespace.yml
      runner-type: ${{ inputs.runner-type }}

  deploy-github-org-runner:
    needs: [
      deploy-tf-state-namespace,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/github-org-runners
      runner-type: ${{ inputs.runner-type }}

  deploy-calico-operator:
    # CNI operator — installs the tigera-operator + its CRDs. Split from
    # deploy-calico so the Installation CR applies only once the CRDs are
    # Established (mirrors knative-operator -> knative). Runs as early as
    # possible, in parallel with the runner job.
    needs: [
      deploy-tf-state-namespace,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/calico-operator

  deploy-calico:
    # The Installation CR — tells the operator to deploy Calico (calico-node,
    # which installs the CNI). CNI is functional once this completes, so every
    # pod-scheduling job below depends on it.
    needs: [
      deploy-calico-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/calico

  deploy-openebs:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/openebs

  deploy-grafana-operator:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/grafana-operator

  deploy-valkey-operator:
    needs: [
      deploy-grafana-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/valkey-operator

  deploy-prometheus-operator:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/prometheus-operator

  deploy-cert-manager:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/cert-manager

  deploy-kubevirt-operator:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/kubevirt-operator

  deploy-clickhouse-operator:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/clickhouse-operator
      needs-kubectl: true

  deploy-kafka-operator:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/kafka-operator

  deploy-knative-operator:
    needs: [
      deploy-github-org-runner,
      deploy-calico,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/knative-operator

  deploy-opensearch-operator:
    needs: [
      deploy-cert-manager,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/opensearch-operator

  deploy-traefik:
    needs: [
      deploy-openebs,
      deploy-cert-manager,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/traefik

  deploy-cloudnative-pg:
    needs: [
      deploy-openebs,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/cloudnative-pg

  deploy-mariadb-operator:
    needs: [
      deploy-openebs,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/mariadb-operator

  deploy-velero:
    needs: [
      deploy-openebs,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/velero

  deploy-kubevirt:
    needs: [
      deploy-openebs,
      deploy-kubevirt-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      needs-kubectl: true
      iac-dir: ./iac/kubevirt

  deploy-crowdsec:
    needs: [
      deploy-traefik,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/crowdsec

  deploy-traefik-config:
    needs: [
      deploy-traefik,
      deploy-crowdsec,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/traefik-config

  deploy-openldap:
    needs: [
      deploy-traefik-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/openldap

  deploy-keycloak:
    needs: [
      deploy-cloudnative-pg,
      deploy-openldap,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/keycloak

  deploy-keycloak-config:
    needs: [
      deploy-keycloak,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/keycloak-config

  deploy-vaultwarden:
    needs: [
      deploy-cloudnative-pg,
      deploy-openldap,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/vaultwarden

  deploy-ocis:
    needs: [
      deploy-keycloak-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/ocis
      resource-name: null_resource.ocis_helm_repo_clone
      force-apply-all: true

  deploy-prometheus:
    needs: [
      deploy-prometheus-operator,
      deploy-openebs,
      deploy-grafana,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/prometheus

  # --- Sentry ---
  # Dedicated job (not in deploy-bulk): app modules read its auth token via
  # remote_state, so outline/erpnext/posthog (in deploy-bulk) and grafana must
  # apply after it.
  deploy-sentry:
    needs: [
      deploy-cloudnative-pg,
      deploy-kafka-operator,
      deploy-clickhouse-operator,
      deploy-keycloak-config,
      deploy-traefik-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/sentry

  deploy-grafana:
    needs: [
      deploy-grafana-operator,
      deploy-keycloak-config,
      deploy-traefik,
      deploy-openebs,
      deploy-cloudnative-pg,
      deploy-sentry,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/grafana

  deploy-bulk:
    needs: [
      deploy-keycloak-config,
      deploy-mariadb-operator,
      deploy-grafana-operator,
      deploy-velero,
      deploy-kafka-operator,
      deploy-opensearch-operator,
      deploy-clickhouse-operator,
      deploy-cloudnative-pg,
      deploy-traefik-config,
      deploy-sentry,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    strategy:
      fail-fast: false
      matrix:
        application: [
          outline,
          services,
          13ft,
          n8n,
          erpnext,
          web-check,
          convertx,
          posthog,
        ]

    with:
      iac-dir: ./iac/${{ matrix.application }}

  # --- OpenTelemetry tracing platform ---
  # operator -> Tempo backend -> collector (collector exports into Tempo).
  deploy-otel-operator:
    needs: [
      deploy-cert-manager,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/otel-operator

  deploy-tempo:
    needs: [
      deploy-grafana,
      deploy-openebs,
      deploy-prometheus-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/tempo

  deploy-otel-collector:
    needs: [
      deploy-otel-operator,
      deploy-tempo,
      deploy-prometheus-operator,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/otel-collector

  deploy-knative:
    # Knative Serving + Eventing (full eventing) + live test functions.
    # Dependencies:
    #   - knative-operator  : KnativeServing/KnativeEventing CRDs
    #   - traefik           : Knative provider (Tier-1) + shared-middleware
    #                         remote_state for the Tier-2 ingress test fn
    #   - kafka-operator    : Strimzi CRDs for the in-module test Kafka
    #   - prometheus-operator / grafana-operator : ServiceMonitor /
    #                         GrafanaDashboard CRDs (observability)
    #   - keycloak-config   : the ingress module's keycloak provider reads its
    #                         state (even for auth_mode=none)
    needs: [
      deploy-knative-operator,
      deploy-traefik,
      deploy-kafka-operator,
      deploy-prometheus-operator,
      deploy-grafana-operator,
      deploy-keycloak-config,
    ]
    uses: ./.github/workflows/kubernetes-iac-deploy.yml
    secrets: inherit

    with:
      iac-dir: ./iac/knative
