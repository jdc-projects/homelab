name: Nightly Backup
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 2 * * *'

env:
  CLIENT_CERT_DATA: ${{ secrets.KUBE_CLIENT_CERT_DATA }}
  CLIENT_KEY_DATA: ${{ secrets.KUBE_CLIENT_KEY_DATA }}
  CLUSTER_CA_CERT_DATA: ${{ secrets.KUBE_CLUSTER_CA_CERT_DATA }}
  SERVER_IP_ADDRESS: ${{ secrets.K3S_IP_ADDRESS }}
  SERVER_KUBE_PORT: ${{ vars.SERVER_KUBE_PORT }}
  SERVER_BASE_DOMAIN: ${{ vars.SERVER_BASE_DOMAIN }}
  BACKUP_START_MAX_RETRIES: 3
  BACKUP_START_RETRY_DELAY: 30

jobs:
  check-server-up:
    runs-on: ubuntu-latest

    steps:
      - name: Get server status
        run: curl --max-time 5 https://ping.${{ vars.SERVER_BASE_DOMAIN }}

  silence-alerts:
    needs: [
      check-server-up,
    ]
    uses: ./.github/workflows/alertmanager-silence.yml
    secrets: inherit

    with:
      do_silence: true
      run_tag: nightly-backup-${{ github.run_id }}

  hibernate-databases:
    needs: [
      check-server-up,
      silence-alerts,
    ]
    uses: ./.github/workflows/databases-hibernate.yml
    secrets: inherit

    with:
      do-hibernate: true

  start-velero-backup:
    needs: [
      hibernate-databases,
    ]
    runs-on: self-hosted

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Setup cluster access"
        uses: ./.github/actions/setup-cluster
        with:
          velero-cli-version: 'v1.18.2'
      # Failed-backup cleanup runs BEFORE this run's backup exists. If it ran
      # after (as it used to), a backup that failed fast would be deleted by
      # its own run — and the subsequent "items[-1]" wait would then match the
      # previous night's Completed backup and the job would go green. Cleaning
      # up here instead means a failure always survives until the next run,
      # ~24h of visibility for investigation. Matches any Failed/PartiallyFailed
      # backup (manual/ad-hoc runs included).
      - name: "Get failed backups to delete"
        id: "get-failed-backups-to-delete"
        env:
          MAX_NUM_BACKUPS: 30
        run: |
          velero get backups -o yaml > backups.yml
          yq '.items[] | select(.status.phase == "Failed" or .status.phase == "PartiallyFailed") | .metadata.name' backups.yml > backups-to-delete.txt
          sed -i '{:q;N;s/\n/ /g;t q}' backups-to-delete.txt
          echo "failed-backups-to-delete=$(cat backups-to-delete.txt)" >> "$GITHUB_OUTPUT"
      - name: "Delete failed backups"
        if: steps.get-failed-backups-to-delete.outputs.failed-backups-to-delete != ''
        run: velero delete backup ${{ steps.get-failed-backups-to-delete.outputs.failed-backups-to-delete }} --confirm
      - name: "Start backup"
        run: retry --times="$BACKUP_START_MAX_RETRIES" --delay="$BACKUP_START_RETRY_DELAY" -- velero create backup --from-schedule nightly
      - name: "Wait for snapshots"
        run: |
          velero get backups -o yaml > backups.yml
          kubectl -n "$(yq '.items[-1].metadata.namespace' backups.yml)" wait backups.velero.io "$(yq '.items[-1].metadata.name' backups.yml)" --timeout 10m --for "jsonpath={.status.phase}=WaitingForPluginOperations"

  check-backup-success:
    needs: [
      start-velero-backup,
    ]
    runs-on: self-hosted

    timeout-minutes: 1380

    steps:
      - name: "Repo checkout"
        uses: actions/checkout@v7
      - name: "Setup cluster access"
        uses: ./.github/actions/setup-cluster
        with:
          velero-cli-version: 'v1.18.2'
      - name: "Get old backups to delete"
        id: "get-old-backups-to-delete"
        env:
          MAX_NUM_BACKUPS: 30
        run: |
          velero get backups -o yaml > backups.yml
          yq '.items[] | select(.status.phase == "Completed") | .metadata.name' backups.yml > backups.txt
          head -n -${{ env.MAX_NUM_BACKUPS }} backups.txt > backups-to-delete.txt
          truncate -s -1 backups-to-delete.txt
          sed -i '{:q;N;s/\n/ /g;t q}' backups-to-delete.txt
          echo "old-backups-to-delete=$(cat backups-to-delete.txt)" >> "$GITHUB_OUTPUT"
      - name: "Delete old backups"
        if: steps.get-old-backups-to-delete.outputs.old-backups-to-delete != ''
        run: velero delete backup ${{ steps.get-old-backups-to-delete.outputs.old-backups-to-delete }} --confirm
      - name: "Wait for backup to complete"
        timeout-minutes: 300
        run: |
          velero get backups -o yaml > backups.yml
          kubectl -n "$(yq '.items[-1].metadata.namespace' backups.yml)" wait backups.velero.io "$(yq '.items[-1].metadata.name' backups.yml)" --timeout 2h --for "jsonpath={.status.phase}=Completed"

  restart-databases:
    needs: [
      start-velero-backup,
      hibernate-databases,
    ]
    if: always() && !cancelled() && needs.hibernate-databases.outputs.attempted == 'true'
    uses: ./.github/workflows/databases-hibernate.yml
    secrets: inherit

    with:
      do-hibernate: false

  unsilence-alerts:
    needs: [
      restart-databases,
      silence-alerts,
    ]
    if: always() && !cancelled() && needs.silence-alerts.result == 'success'
    uses: ./.github/workflows/alertmanager-silence.yml
    secrets: inherit

    with:
      do_silence: false
      run_tag: nightly-backup-${{ github.run_id }}

    # The unsilence leg polls (up to 25m) until backup-induced alerts clear before
    # re-arming; the hard job timeout lives on the called job in alertmanager-silence.yml.
